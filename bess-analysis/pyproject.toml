[project]
name = "bess-analysis"
version = "0.1.0"
description = "Noga MCP price pipeline and BESS arbitrage feasibility model"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "numpy-financial>=1.0",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
