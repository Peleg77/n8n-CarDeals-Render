# Storage-add-on economics under Israel's REGULATED PV+storage feed-in
# tariff track (NOT the MCP merchant model in config.yaml/run_pipeline.py).
#
# Every value below is tagged [SOURCED] (found via web research, cite in
# fit_storage_calculator.py docstring, may be outdated) or [ASSUMPTION]
# (my estimate — verify before committing money). See the chat discussion
# and outputs/assumptions.md-style caveats in fit_storage_calculator.py.

# --- Physical size ---
storage_capacity_kwh: 400   # [DESIGN CHOICE] <=600 kWh keeps the building-permit exemption
storage_power_kw: 100
pv_capacity_kw: 100         # [DESIGN CHOICE] <=300 kW keeps you on the tier-1 tariff below

# --- Capex ---
capex_storage_nis_per_kwh: 1500   # [ASSUMPTION -- WEAKEST INPUT] no sourced Israeli commercial-scale
                                    # (100-600 kWh) figure found. Residential retail was
                                    # 2,200-4,400 NIS/kWh; utility-scale was ~460 NIS/kWh
                                    # (global, converted). This interpolates -- get real
                                    # installer quotes before trusting it.
other_capex_nis: 50000            # [ASSUMPTION] inverter/EPC/grid-connection/professional fees placeholder
opex_nis_per_year: 8000           # [ASSUMPTION] O&M/insurance, scaled down from the MCP model's
                                    # 20,000 NIS/MW-year benchmark -- get a real maintenance quote

# --- Tariff table ---
# [SOURCED, POSSIBLY OUTDATED] Israel Electricity Authority decision, Jan 2024,
# for PV <=300kW paired with storage at a shared connection point, discharge
# during evening peak (17:00-23:00). VERIFY THE CURRENT RATE before relying
# on this -- tariffs are revised periodically and this was the only decision
# text found via search (WebFetch to the primary source was blocked in this
# environment).
tariff_agorot_per_kwh:
  summer: 134.24
  winter: 93.2
  transition: 37.21

# --- Discharge volume ---
# [ASSUMPTION] Target is the "800-hour" qualifying track (verify current
# rules/ratio requirements). Split across seasons here is illustrative
# (proportional to season length), NOT sourced -- real distribution depends
# on your solar output profile and battery sizing relative to daily generation.
discharge_hours_per_year:
  summer: 264   # ~4 months
  winter: 198   # ~3 months
  transition: 338  # ~5 months
avg_discharge_power_kw: 80   # [ASSUMPTION] <= storage_power_kw; realistic average discharge
                               # rate during qualifying hours (not always full rated power)

# --- Financial (developer's own return) ---
project_life_years: 15            # [ASSUMPTION] battery technical/warranty life. Whether the
                                    # STORAGE tariff itself is locked for a long term (like the
                                    # classic 25-year solar FiT) or revised annually like a normal
                                    # regulated tariff is UNVERIFIED -- this materially changes
                                    # the real answer and needs confirmation from a licensed
                                    # energy advisor or the Electricity Authority directly.
discount_rate_unlevered: 0.08
degradation_annual: 0.02
availability: 0.97

# --- Exit: selling the portfolio to a passive investor ---
buyer_required_yield: 0.10        # target return the buyer wants on their purchase price
target_portfolio_sale_price_nis: 5000000

# --- Sensitivity ranges (weakest assumption gets the widest sweep) ---
sensitivity:
  capex_storage_nis_per_kwh: [800, 1100, 1500, 2000, 2500]
  avg_discharge_power_kw: [40, 60, 80, 100]
